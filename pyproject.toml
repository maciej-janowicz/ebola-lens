[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ebolalens"
version = "0.0.0"
description = "A lightweight tool for processing official outbreak reports"
readme = "README.md"
requires-python = ">=3.11"

[project.optional-dependencies]
dev = ["pytest>=8"]
exploration = [
    "pdfplumber>=0.10.0",
    "pypdf>=3.0.0",
    "pymupdf>=1.23.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
